<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Contact / Gamester Reviews</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1 class="middletext">Gamester Reviews</h1>
            <nav> 
                <a href="index.html">Home</a>
                <a href="featured.html">Featured</a>
                <a href="top-picks.html">Top Picks</a>
                <a href="gamereviews.html">Game Review</a>
                <a href="aboutreviewer.html">About Reviewer</a>
                <a href="contact.html">Contact</a>
            </nav>
        </header>
        <main>
            <section id="contact">   
                <h2>Contact Us</h2>
                <p> If you have any questions about what game you should try shoot us a message!</p>
                
                    <form>
                        <label for="name">Name:<br></label>
                        <input type="text" id="name" name="name" required>
                        <br> 
                        <label for="email">Email:<br></label>
                        <input type="email" id="email" name="email" required>
                        <br> 
                        <label for="message">Message:<br></label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                        <br> 
                        <label>Rate our website:<br></label>
                        <div class="star-rating">
                        <input type="radio" id="star1" name="rating" value="1">
                        <label for-star1>☆</label>

                         <input type="radio" id="star2" name="rating" value="2">
                        <label for-star2>☆</label>

                         <input type="radio" id="star3" name="rating" value="3">
                        <label for-star3>☆</label>

                         <input type="radio" id="star4" name="rating" value="4">
                        <label for-star4>☆</label>

                         <input type="radio" id="star5" name="rating" value="5">
                        <label for-star5>☆</label>
                        </div>


                        <button type="submit">Send Message</button>
                        <button type="reset">Reset</button>
                    </form>
                
            </section>
        </main>
        <footer>Gamester Reviews / 2026</footer>

    </body>
</html>
